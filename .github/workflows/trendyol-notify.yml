name: Trendyol Bildirim

on:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendyol-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: Scripti calistir
        env:
          TRENDYOL_SELLER_ID: ${{ secrets.TRENDYOL_SELLER_ID }}
          TRENDYOL_API_KEY: ${{ secrets.TRENDYOL_API_KEY }}
          TRENDYOL_API_SECRET: ${{ secrets.TRENDYOL_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_IADE_SORU_CHAT_ID: ${{ secrets.TELEGRAM_IADE_SORU_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, sys
          required = ["TRENDYOL_SELLER_ID", "TRENDYOL_API_KEY",
                      "TRENDYOL_API_SECRET", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"]
          missing = [name for name in required if not os.environ.get(name, "").strip()]
          if missing:
              print("::error::Eksik GitHub Secrets: " + ", ".join(missing))
              sys.exit(1)
          PY
          python trendyol_notify.py

      - name: State kaydet
        if: always()
        run: |
          git config user.name "trendyol-bot"
          git config user.email "actions@github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "state guncellendi"
            git push
          fi
